<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KurczakCraft</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="background">
    <h1>Witamy na KurczakCraft!</h1>
    <button onclick="openPopup()">Kup rangę</button>
    <div id="popup" class="popup">
      <form id="rankForm">
        <label>Nick: <input type="text" name="nick" /></label><br />
        <label>Ranga:
          <select name="ranga">
            <option value="vip">VIP</option>
            <option value="svip">SVIP</option>
            <option value="gvip">G-VIP</option>
          </select>
        </label><br />
        <label>Opinia: <textarea name="opinia"></textarea></label><br />
        <button type="submit">Kup teraz</button>
      </form>
    </div>
    <div id="opinie"></div>
  </div>
  <script src="main.js"></script>
</body>
</html>
