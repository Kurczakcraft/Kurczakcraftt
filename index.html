
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>KurczakCraft</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="main.js"></script>
</head>
<body>
  <header>
    <h1>KurczakCraft</h1>
    <p>Oficjalna strona serwera Minecraft: <strong>kurczakcraft.pl</strong></p>
  </header>

  <section class="rangi">
    <h2>Rangi</h2>
    <div class="ranga" id="vip">
      <h3>VIP</h3>
      <p class="opis">Dostęp do podstawowych komend i przywilejów.</p>
      <button onclick="openForm('vip')">Kup teraz</button>
    </div>
    <div class="ranga" id="svip">
      <h3>SVIP</h3>
      <p class="opis">Więcej komend, większy wpływ na serwer.</p>
      <button onclick="openForm('svip')">Kup teraz</button>
    </div>
    <div class="ranga" id="gvip">
      <h3>GVIP</h3>
      <p class="opis">Pełen pakiet możliwości na serwerze.</p>
      <button onclick="openForm('gvip')">Kup teraz</button>
    </div>
  </section>

  <section class="opinie">
    <h2>Opinie graczy</h2>
    <div id="opinie-lista"></div>
    <div class="nawigacja">
      <button onclick="prevOpinion()">←</button>
      <button onclick="nextOpinion()">→</button>
    </div>
  </section>

  <div id="popup-form" class="popup hidden">
    <div class="popup-content">
      <span class="close" onclick="closeForm()">&times;</span>
      <h2>Kup rangę</h2>
      <form id="zamowienie-form">
        <input type="hidden" id="wybranaRanga" name="ranga" />
        <label for="nick">Nick z Minecraft:</label>
        <input type="text" id="nick" name="nick" required />
        <label for="metoda">Metoda płatności:</label>
        <select id="metoda" name="metoda">
          <option value="blik">BLIK</option>
          <option value="paypal">PayPal</option>
        </select>
        <button type="submit">Złóż zamówienie</button>
      </form>
    </div>
  </div>

  <footer>
    <p>KurczakCraft &copy; 2025</p>
  </footer>
</body>
</html>
