<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KurczakCraft - Sklep Rang</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://i.imgur.com/FeRih9S.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: rgba(0,0,0,0.7);
      text-align: center;
      padding: 30px 20px;
    }
    header h1 {
      font-size: 3em;
    }
    .orange { color: orange; }
    .white { color: white; }
    section {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
    }
    .product, .opinion-form {
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    button {
      padding: 12px 20px;
      background: linear-gradient(45deg, #ffa500, #ffcc00);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: linear-gradient(45deg, #ffcc00, #ffa500);
    }
    .opinion-list p {
      background: #444;
      padding: 10px;
      border-radius: 5px;
      margin-top: 10px;
    }
    footer {
      text-align: center;
      color: #ccc;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="orange">Kurczak</span><span class="white">Craft</span></h1>
  </header>

  <section>
    <div class="product">
      <h2>Zamów rangę</h2>
      <input type="text" id="nick" placeholder="Nick Minecraft">
      <input type="email" id="email" placeholder="Adres Email">
      <select id="ranga">
        <option disabled selected>Wybierz rangę</option>
        <option>VIP</option>
        <option>SVIP</option>
        <option>GVIP</option>
      </select>
      <select id="platnosc">
        <option disabled selected>Wybierz metodę płatności</option>
        <option>PayPal</option>
        <option>Stripe</option>
        <option>Paysafecard</option>
        <option>Karta</option>
        <option>SMS</option>
        <option>BLIK</option>
      </select>
      <button onclick="zlozZamowienie()">Zamów</button>
    </div>

    <div class="opinion-form">
      <h3>Dodaj opinię</h3>
      <input type="text" id="nickOpinion" placeholder="Nick Minecraft">
      <textarea id="tekstOpinion" placeholder="Twoja opinia..." rows="3"></textarea>
      <button onclick="dodajOpinie()">Dodaj opinię</button>
    </div>

    <div class="opinion-list" id="opinionList"></div>
  </section>

  <footer>
    KurczakCraft &copy; 2025 – Wszelkie prawa zastrzeżone.
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjkWkuC43qRrYrYimohrWSF5r-ZR2-EhQ",
      authDomain: "kurczakcraft-34cf6.firebaseapp.com",
      projectId: "kurczakcraft-34cf6",
      storageBucket: "kurczakcraft-34cf6.appspot.com",
      messagingSenderId: "523073421401",
      appId: "1:523073421401:web:14640c7431dd9e8cb27148",
      measurementId: "G-H2G0L57J1Q"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function dodajOpinie() {
      const nick = document.getElementById('nickOpinion').value.trim();
      const tekst = document.getElementById('tekstOpinion').value.trim();
      if (nick && tekst) {
        db.collection('opinie').add({ nick, tekst, data: new Date() });
        document.getElementById('nickOpinion').value = '';
        document.getElementById('tekstOpinion').value = '';
      }
    }

    function zlozZamowienie() {
      const nick = document.getElementById('nick').value.trim();
      const email = document.getElementById('email').value.trim();
      const ranga = document.getElementById('ranga').value;
      const platnosc = document.getElementById('platnosc').value;
      if (nick && email && ranga && platnosc) {
        db.collection('zamowienia').add({ nick, email, ranga, platnosc, data: new Date() });
        alert('Zamówienie złożone!');
        document.getElementById('nick').value = '';
        document.getElementById('email').value = '';
        document.getElementById('ranga').value = '';
        document.getElementById('platnosc').value = '';
      }
    }

    function ladujOpinie() {
      db.collection('opinie').orderBy('data', 'desc').onSnapshot(snapshot => {
        const container = document.getElementById('opinionList');
        container.innerHTML = '';
        snapshot.forEach(doc => {
          const d = doc.data();
          const p = document.createElement('p');
          p.innerHTML = `<strong>${d.nick}:</strong> ${d.tekst}`;
          container.appendChild(p);
        });
      });
    }

    ladujOpinie();
  </script>
</body>
</html>
