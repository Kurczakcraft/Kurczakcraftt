<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>KurczakCraft</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url('https://i.imgur.com/ATywzml.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
    }
    header {
      text-align: center;
      padding: 40px 0;
      background: rgba(0,0,0,0.7);
    }
    h1 {
      font-size: 3em;
    }
    .orange { color: orange; }
    .white { color: white; }

    .section {
      max-width: 800px;
      margin: 30px auto;
      background: rgba(0,0,0,0.7);
      padding: 30px;
      border-radius: 15px;
    }
    .button {
      background: orange;
      color: #000;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    input, select, textarea {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    .opinion {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1><span class="orange">Kurczak</span><span class="white">Craft</span></h1>
  </header>

  <div class="section">
    <h2>Zamów rangę</h2>
    <input id="nick" placeholder="Nick Minecraft">
    <input id="email" type="email" placeholder="Email">
    <select id="ranga">
      <option disabled selected>Wybierz rangę</option>
      <option>VIP</option>
      <option>SVIP</option>
      <option>GVIP</option>
    </select>
    <select id="metoda">
      <option disabled selected>Wybierz metodę płatności</option>
      <option>PayPal</option>
      <option>Stripe</option>
      <option>Paysafecard</option>
      <option>Karta</option>
      <option>SMS</option>
      <option>BLIK</option>
    </select>
    <button class="button" onclick="handleZamow()">Kup teraz</button>
  </div>

  <div class="section">
    <h2>Dodaj opinię</h2>
    <input id="opNick" placeholder="Twój nick">
    <textarea id="opTekst" placeholder="Twoja opinia..."></textarea>
    <button class="button" onclick="handleOpinie()">Dodaj opinię</button>
  </div>

  <div class="section">
    <h2>Opinie graczy</h2>
    <div id="opinie"></div>
  </div>

  <footer style="text-align:center; padding: 30px; color:#ccc">
    KurczakCraft © 2025 – Wszelkie prawa zastrzeżone.
  </footer>

  <script type="module" src="main.js"></script>
</body>
</html>
