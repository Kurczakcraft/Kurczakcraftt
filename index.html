<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KurczakCraft - Sklep Rang</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: url('https://i.imgur.com/ATywzml.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    header {
      background: rgba(0,0,0,0.7);
      color: #fff;
      text-align: center;
      padding: 30px 20px;
    }
    header h1 {
      font-size: 3em;
    }
    .orange { color: orange; }
    .white { color: white; }
    section {
      max-width: 1000px;
      margin: auto;
      padding: 30px;
      background: rgba(0,0,0,0.6);
      border-radius: 10px;
    }
    .product {
      background: rgba(255,255,255,0.1);
      border: 1px solid #555;
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      backdrop-filter: blur(5px);
    }
    button {
      padding: 12px 20px;
      margin-top: 15px;
      background: linear-gradient(45deg, #ffa500, #ffcc00);
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: linear-gradient(45deg, #ffcc00, #ffa500);
    }
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #222;
      padding: 25px;
      border-radius: 15px;
      z-index: 999;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    .modal.active {
      display: block;
    }
    .overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 998;
    }
    .overlay.active {
      display: block;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
      font-size: 1em;
    }
    .opinion {
      margin-top: 40px;
    }
    .opinion-form button {
      margin-top: 10px;
    }
    .opinion-list p {
      background: rgba(255, 255, 255, 0.2);
      padding: 15px;
      border-left: 4px solid orange;
      border-radius: 8px;
      margin-top: 10px;
    }
    footer {
      text-align: center;
      color: #ccc;
      padding: 20px;
      margin-top: 40px;
    }
  </style>
  <script>
    function showModal() {
      document.getElementById('overlay').classList.add('active');
      document.getElementById('modalForm').classList.add('active');
    }
    function closeModal() {
      document.getElementById('overlay').classList.remove('active');
      document.getElementById('modalForm').classList.remove('active');
    }
    function addOpinion() {
      const textarea = document.getElementById('newOpinion');
      const opinionText = textarea.value.trim();
      if (opinionText) {
        const container = document.getElementById('opinionList');
        const p = document.createElement('p');
        p.textContent = opinionText;
        container.appendChild(p);
        textarea.value = '';
      }
    }
  </script>
</head>
<body>
  <div id="overlay" class="overlay" onclick="closeModal()"></div>

  <header>
    <h1><span class="orange">Kurczak</span><span class="white">Craft</span></h1>
  </header>

  <section>
    <div class="product">
      <h2>Rangi VIP / SVIP / GVIP</h2>
      <p>kity, dalsze rtp, kolorowe nicky</p>
      <button onclick="showModal()">Kup Teraz</button>
    </div>

    <div class="modal" id="modalForm">
      <h3>Zamów Rangę</h3>
      <input type="text" placeholder="Nick Minecraft">
      <input type="email" placeholder="Adres Email">
      <select>
        <option disabled selected>Wybierz rangę</option>
        <option>VIP</option>
        <option>SVIP</option>
        <option>GVIP</option>
      </select>
      <select>
        <option disabled selected>Wybierz metodę płatności</option>
        <option>PayPal</option>
        <option>Stripe</option>
        <option>Paysafecard</option>
        <option>Karta</option>
        <option>SMS</option>
        <option>BLIK</option>
      </select>
      <button>Zamów</button>
      <button onclick="closeModal()">Zamknij</button>
    </div>

    <div class="opinion">
      <h3>Opinie graczy</h3>
      <div class="opinion-form">
        <textarea id="newOpinion" placeholder="Twoja opinia..." rows="3"></textarea>
        <button onclick="addOpinion()">Dodaj opinię</button>
      </div>
      <div class="opinion-list" id="opinionList"></div>
    </div>
  </section>

  <footer>
    KurczakCraft &copy; 2025 – Wszelkie prawa zastrzeżone.
  </footer>
</body>
</html>
