<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KurczakCraft - Sklep</title>
  <script type="module">
    // Firebase config
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBjkWkuC43qRrYrYimohrWSF5r-ZR2-EhQ",
      authDomain: "kurczakcraft-34cf6.firebaseapp.com",
      projectId: "kurczakcraft-34cf6",
      storageBucket: "kurczakcraft-34cf6.firebasestorage.app",
      messagingSenderId: "523073421401",
      appId: "1:523073421401:web:14640c7431dd9e8cb27148",
      measurementId: "G-H2G0L57J1Q"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dodaj opinię
    document.getElementById("submitOpinion").addEventListener("click", async () => {
      const nick = document.getElementById("opNick").value;
      const text = document.getElementById("opText").value;
      if (nick && text) {
        await addDoc(collection(db, "opinie"), {
          nick,
          text,
          date: new Date().toISOString()
        });
        alert("Dziekujemy za opinię!");
        location.reload();
      }
    });

    // Pobierz opinie
    const opinieContainer = document.getElementById("opinieList");
    const snapshot = await getDocs(collection(db, "opinie"));
    snapshot.forEach(doc => {
      const data = doc.data();
      const div = document.createElement("div");
      div.innerHTML = `<strong>${data.nick}</strong>: ${data.text}`;
      opinieContainer.appendChild(div);
    });

    // Dodaj zamówienie
    document.getElementById("submitOrder").addEventListener("click", async () => {
      const nick = document.getElementById("mcNick").value;
      const email = document.getElementById("email").value;
      const ranga = document.getElementById("ranga").value;
      const platnosc = document.getElementById("platnosc").value;
      if (nick && email && ranga && platnosc) {
        await addDoc(collection(db, "zamowienia"), {
          nick,
          email,
          ranga,
          platnosc,
          date: new Date().toISOString()
        });
        alert("Zamówienie przyjęte!");
        location.reload();
      }
    });
  </script>
  <style>
    body { font-family: Arial; background: #f7f7f7; color: #222; padding: 20px; }
    h1 { text-align: center; }
    .section { margin: 30px auto; max-width: 600px; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px #ccc; }
    input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; }
    button { padding: 10px 20px; background: orange; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .opinie { margin-top: 20px; }
    .opinie div { background: #eee; padding: 10px; margin: 5px 0; border-radius: 5px; }
  </style>
</head>
<body>
  <h1><span style="color:orange">Kurczak</span>Craft</h1>
  <div class="section">
    <h2>Dodaj opinię</h2>
    <input type="text" id="opNick" placeholder="Twój nick Minecraft">
    <textarea id="opText" rows="4" placeholder="Twoja opinia..."></textarea>
    <button id="submitOpinion">Wyślij opinię</button>
    <div class="opinie" id="opinieList"></div>
  </div>
  <div class="section">
    <h2>Zamów rangę</h2>
    <input type="text" id="mcNick" placeholder="Nick Minecraft">
    <input type="email" id="email" placeholder="Email">
    <select id="ranga">
      <option disabled selected>Wybierz rangę</option>
      <option>VIP</option>
      <option>SVIP</option>
      <option>GVIP</option>
    </select>
    <select id="platnosc">
      <option disabled selected>Metoda płatności</option>
      <option>PayPal</option>
      <option>Stripe</option>
      <option>SMS</option>
      <option>BLIK</option>
      <option>Karta</option>
    </select>
    <button id="submitOrder">Złóż zamówienie</button>
  </div>
</body>
</html>
